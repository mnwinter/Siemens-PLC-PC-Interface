[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siemens-plc-pc-interface"
version = "0.1.0"
description = "Configuration-driven Siemens PLC simulation interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-snap7==3.1.0",
]

[project.scripts]
siemens-plc-pc-interface = "siemens_plc_pc_interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
